name: Build and Release CSCsecure

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
        
    - name: Build the Project
      # Uses .slnx matching your GitHub repository
      run: msbuild CSCsecure.slnx /p:Configuration=Release /p:Platform=x64
      
    - name: Create Release and Upload EXE
      uses: softprops/action-gh-release@v2
      with:
        files: x64/Release/CSCsecure.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
